name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-v4
  cancel-in-progress: true

jobs:
  lint:
    runs-on: arc-runner-set-dotfiles
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: |
          mapfile -t shell_files < <(
            find scripts -name '*.sh' -type f ! -path 'scripts/dual-boot-ubuntu-wizard.sh'
          )
          shell_files+=(install_zsh.sh tools/benchmark.sh)
          shellcheck --severity=warning "${shell_files[@]}"
          shellcheck --severity=warning --exclude=SC2034 scripts/dual-boot-ubuntu-wizard.sh

  nixos:
    runs-on: arc-runner-set-dotfiles
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install runner prerequisites
        run: sudo apt-get update && sudo apt-get install -y xz-utils
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            lazy-trees = false
            max-jobs = 2
            cores = 2
      - name: Evaluate NixOS configuration
        run: nix eval --raw ./nixos#nixosConfigurations.zephyrusG14.config.system.stateVersion
      - name: Evaluate NixOS system toplevel
        timeout-minutes: 5
        run: nix eval --raw ./nixos#nixosConfigurations.zephyrusG14.config.system.build.toplevel.name
      - name: Check Nix formatting
        run: |
          cd nixos
          nix fmt
          git diff --exit-code -- '*.nix'
