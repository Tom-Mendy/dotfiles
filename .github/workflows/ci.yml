name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: arc-runner-set-dotfiles
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: |
          mapfile -t shell_files < <(
            find scripts -name '*.sh' -type f ! -path 'scripts/dual-boot-ubuntu-wizard.sh'
          )
          shell_files+=(install_zsh.sh tools/benchmark.sh)
          shellcheck --severity=warning "${shell_files[@]}"
          shellcheck --severity=warning --exclude=SC2034 scripts/dual-boot-ubuntu-wizard.sh

  nixos:
    runs-on: arc-runner-set-dotfiles
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install runner prerequisites
        run: sudo apt-get update && sudo apt-get install -y xz-utils
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            lazy-trees = false
      - name: Evaluate NixOS configuration
        run: nix eval --raw ./nixos#nixosConfigurations.zephyrusG14.config.system.stateVersion
      - name: Check Nix formatting
        run: |
          cd nixos
          nix fmt
          git diff --exit-code -- '*.nix'
      - name: Build Zephyrus G14 configuration
        timeout-minutes: 30
        run: nix build ./nixos#nixosConfigurations.zephyrusG14.config.system.build.toplevel --no-link

  zsh-bench:
    runs-on: arc-runner-set-dotfiles
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Zsh benchmark
        run: |
          ./install_zsh.sh
          zsh -f -c 'source "$HOME/.zshrc"'
      - name: Run benchmark
        timeout-minutes: 8
        env:
          ZSH_BENCH_LOGIN: "no"
          ZSH_BENCH_ITERS: "4"
        run: ./tools/benchmark.sh
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zsh-bench
          path: artifacts/
