name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: arc-runner-set-dotfiles
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install runner prerequisites
        run: sudo apt-get update && sudo apt-get install -y xz-utils
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            lazy-trees = false
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: "disabled"
      - name: ShellCheck
        run: |
          mapfile -t shell_files < <(
            find scripts -name '*.sh' -type f ! -path 'scripts/dual-boot-ubuntu-wizard.sh'
          )
          shell_files+=(install_zsh.sh tools/benchmark.sh)
          nix develop ./nixos -c shellcheck --severity=warning "${shell_files[@]}"
          nix develop ./nixos -c shellcheck --severity=warning --exclude=SC2034 scripts/dual-boot-ubuntu-wizard.sh

  nixos:
    runs-on: arc-runner-set-dotfiles
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install runner prerequisites
        run: sudo apt-get update && sudo apt-get install -y xz-utils
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            lazy-trees = false
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: "disabled"
      - name: Evaluate NixOS configuration
        run: nix eval --raw ./nixos#nixosConfigurations.zephyrusG14.config.system.stateVersion
      - name: Check Nix formatting
        run: |
          cd nixos
          nix fmt
          git diff --exit-code -- '*.nix'
      - name: Build Zephyrus G14 configuration
        run: nix build ./nixos#nixosConfigurations.zephyrusG14.config.system.build.toplevel --no-link

  zsh-bench:
    runs-on: arc-runner-set-dotfiles
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install runner prerequisites
        run: sudo apt-get update && sudo apt-get install -y xz-utils
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            lazy-trees = false
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: "disabled"
      - name: Prepare Zsh benchmark
        run: |
          mkdir -p "$HOME/.zinit"
          git clone --depth=1 https://github.com/zdharma-continuum/zinit "$HOME/.zinit/bin"
          ln -s "$GITHUB_WORKSPACE/zsh/.p10k.zsh" "$HOME/.p10k.zsh"
          env ZDOTDIR="$GITHUB_WORKSPACE/zsh" \
            nix develop ./nixos -c zsh -dfc 'source "$ZDOTDIR/.zshrc"'
      - name: Run benchmark
        timeout-minutes: 8
        env:
          ZSH_BENCH_LOGIN: "no"
          ZSH_BENCH_ITERS: "4"
        run: |
          nix develop ./nixos -c ./tools/benchmark.sh
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zsh-bench
          path: artifacts/
