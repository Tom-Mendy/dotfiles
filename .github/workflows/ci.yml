name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: arc-runner-set-dotfiles
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: ShellCheck
        run: |
          nix develop -c shellcheck $(find scripts -name '*.sh' -type f) install.sh install_zsh.sh tools/benchmark.sh

  nixos:
    runs-on: arc-runner-set-dotfiles
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Evaluate Nix flake
        run: nix flake check ./nixos --no-build
      - name: Check Nix formatting
        run: |
          cd nixos
          nix fmt
          git diff --exit-code -- '*.nix'
      - name: Build Zephyrus G14 configuration
        run: nix build ./nixos#nixosConfigurations.zephyrusG14.config.system.build.toplevel --no-link

  zsh-bench:
    runs-on: arc-runner-set-dotfiles
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Run benchmark
        run: |
          nix develop -c ./tools/benchmark.sh
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: zsh-bench
          path: artifacts/
